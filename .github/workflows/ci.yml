name: Build

on:
  push:
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "docs/**"
      - "**/*.md"
    branches:
      - "main"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositories
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Install linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libgtk-3-dev libayatana-appindicator3-dev xvfb

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: xvfb-run -a go test ./... -count=1

  build:
    needs: [check]
    runs-on: ${{ matrix.jobs.runs-on || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        jobs:
          - { goos: linux, goarch: amd64, output: amd64, deb: amd64, rpm: x86_64 }
          - { goos: linux, goarch: arm64, output: arm64, runs-on: ubuntu-24.04-arm, deb: arm64, rpm: aarch64 }

          - { goos: windows, goarch: "386", output: "386", runs-on: windows-latest, win: true }
          - { goos: windows, goarch: amd64, output: amd64, runs-on: windows-latest, win: true }
          - { goos: windows, goarch: arm64, output: arm64, runs-on: windows-latest, win: true }

          - { goos: darwin, goarch: amd64, output: amd64, runs-on: macos-14, mac: true }
          - { goos: darwin, goarch: arm64, output: arm64, runs-on: macos-14, mac: true }

    steps:
      - name: Checkout repositories
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Install linux dependencies
        if: matrix.jobs.goos == 'linux'
        run: |
          sudo apt-get update

          # amd64 走 ubuntu-latest，arm64 走原生 ubuntu-24.04-arm，均直接装开发包，无需 multiarch 交叉。
          sudo apt-get install -y \
            gcc pkg-config \
            libgl1-mesa-dev xorg-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Set up environment variables
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "PKGVER=${VERSION}" >> $GITHUB_ENV
          echo "PKGARCH_DEB=${{ matrix.jobs.deb }}" >> $GITHUB_ENV
          echo "PKGARCH_RPM=${{ matrix.jobs.rpm }}" >> $GITHUB_ENV
          echo "BUILDTIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      - name: Install LLVM-MinGW
        if: matrix.jobs.goos == 'windows'
        shell: pwsh
        run: |
          # windows-latest 自带的 mingw 只有 x86_64，编不了 386/arm64；用包的 mstorsjo llvm-mingw 一套覆盖三个架构。
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          scoop install mingw-mstorsjo-llvm-ucrt
          "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Append
          "$env:USERPROFILE\scoop\apps\mingw-mstorsjo-llvm-ucrt\current\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build windows icon resource
        if: matrix.jobs.goos == 'windows'
        shell: bash
        run: |
          set -xeuo pipefail
          go install github.com/akavel/rsrc@latest
          "$(go env GOPATH)/bin/rsrc" -arch ${{ matrix.jobs.goarch }} -ico assets/icon.ico -o rsrc.syso

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.jobs.goos }}
          GOARCH: ${{ matrix.jobs.goarch }}
          CGO_ENABLED: "1"
        run: |
          set -xeuo pipefail
          mkdir -p dist

          # GOOS=windows 时 go build 会给 -o 的名称自动补 .exe，把实际产物名导出给后续步骤
          BIN="gzgspg"
          if [ "${{ matrix.jobs.goos }}" = "windows" ]; then
            BIN="gzgspg.exe"
          fi
          echo "BIN=${BIN}" >> $GITHUB_ENV

          # Windows 三个架构各用 LLVM-MinGW 的对应交叉编译器（x64 自带的 mingw 无法编 386/arm64）。
          if [ "${{ matrix.jobs.goos }}" = "windows" ]; then
            case "${{ matrix.jobs.goarch }}" in
              amd64) export CC="x86_64-w64-mingw32-gcc" ;;
              "386") export CC="i686-w64-mingw32-gcc" ;;
              arm64) export CC="aarch64-w64-mingw32-gcc" ;;
            esac
          fi

          LD_FLAGS="-X 'github.com/summonhim/gzgspg/internal/version.Value=${VERSION}' -X 'github.com/summonhim/gzgspg/internal/version.BuildTime=${BUILDTIME}' -w -s"
          if [ "${{ matrix.jobs.goos }}" = "windows" ]; then
            # GUI 应用：不挂控制台子系统，避免双击时弹出黑框
            LD_FLAGS="-H=windowsgui ${LD_FLAGS}"
          fi
          go build -v -trimpath -ldflags "${LD_FLAGS}" -o "${BIN}"

          if [ "${{ matrix.jobs.goos }}" = "windows" ]; then
            cp "${BIN}" "dist/gzgspg-windows-${{ matrix.jobs.output }}.exe"
            (cd dist && "/c/Program Files/7-Zip/7z.exe" a \
              "gzgspg-windows-${{ matrix.jobs.output }}-${VERSION}.zip" \
              "gzgspg-windows-${{ matrix.jobs.output }}.exe")
          elif [ "${{ matrix.jobs.goos }}" = "linux" ]; then
            tar -czf "dist/gzgspg-linux-${{ matrix.jobs.output }}-${VERSION}.tar.gz" -C . "${BIN}"
          fi

      - name: Package DEB and RPM
        if: matrix.jobs.goos == 'linux'
        shell: bash
        run: |
          set -xeuo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          NFPM="$(go env GOPATH)/bin/nfpm"

          # nfpm 的 arch 是顶层字段，不支持 per-format 覆盖，故每种格式各注入一次 PKGARCH
          PKGARCH="${PKGARCH_DEB}" "$NFPM" package -f files/release/nfpm.yaml -p deb -t dist/
          PKGARCH="${PKGARCH_RPM}" "$NFPM" package -f files/release/nfpm.yaml -p rpm -t dist/

      - name: Package AppImage
        if: matrix.jobs.goos == 'linux' && matrix.jobs.output == 'amd64'
        shell: bash
        run: |
          set -xeuo pipefail
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -e VERSION="${VERSION}" \
            ubuntu:22.04 \
            bash -c '
              set -xeuo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y curl file fuse libfuse2 desktop-file-utils \
                libgtk-3-0 libgtk-3-bin libayatana-appindicator3-1 \
                libgl1 libglx-mesa0 libegl1 libgles2
              curl -fsSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
              # plugin-gtk 没有 release 资源（404），且 linuxdeploy 只按 linuxdeploy-plugin-gtk 这个名字在 PATH 里找插件。
              curl -fsSL -o linuxdeploy-plugin-gtk https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
              chmod +x linuxdeploy linuxdeploy-plugin-gtk
              export PATH="$PWD:$PATH"
              export ARCH=x86_64
              export DEPLOY_GTK_VERSION=3
              export LINUXDEPLOY_OUTPUT_VERSION="${VERSION}"
              # 容器内没有 fuse，让 AppImage 自解压运行
              export APPIMAGE_EXTRACT_AND_RUN=1
              ./linuxdeploy --appdir AppDir \
                --desktop-file files/release/gzgspg.desktop \
                --icon-file assets/icon.png \
                --executable gzgspg \
                --plugin gtk \
                --output appimage
              mv gzgspg*.AppImage "dist/gzgspg-linux-amd64-${VERSION}.AppImage"
            '

      - name: Install WiX
        if: matrix.jobs.goos == 'windows'
        shell: pwsh
        run: dotnet tool install --global wix

      - name: Package MSI
        if: matrix.jobs.goos == 'windows'
        shell: pwsh
        run: |
          ./files/release/build-msi.ps1 `
            -Version "$env:VERSION" `
            -Arch "${{ matrix.jobs.output }}" `
            -ExeName "gzgspg-windows-${{ matrix.jobs.output }}.exe" `
            -DistDir "dist" `
            -OutDir "dist"

      - name: Package macOS app
        if: matrix.jobs.goos == 'darwin'
        shell: bash
        run: |
          set -xeuo pipefail
          APP="dist/gzgspg.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          cp "${BIN}" "$APP/Contents/MacOS/gzgspg"
          chmod +x "$APP/Contents/MacOS/gzgspg"

          sed "s/@@VERSION@@/${VERSION}/" files/release/Info.plist > "$APP/Contents/Info.plist"

          # icon.png -> icon.icns
          ICONSET="$(mktemp -d)/gzgspg.iconset"
          mkdir -p "$ICONSET"
          for s in 16 32 64 128 256 512; do
            sips -z $s $s assets/icon.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2))
            sips -z $d $d assets/icon.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/gzgspg.icns"

          (cd dist && zip -r "gzgspg-macos-${{ matrix.jobs.output }}-${VERSION}.zip" "gzgspg.app")

          # dmg：app + Applications 软链
          STAGE="$(mktemp -d)/dmg"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "gzgspg" -srcfolder "$STAGE" -ov -format UDZO \
            "dist/gzgspg-macos-${{ matrix.jobs.output }}-${VERSION}.dmg"

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.jobs.goos }}-${{ matrix.jobs.output }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [check, build]
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: bin
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R
        working-directory: bin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: bin/*
          draft: true
          generate_release_notes: true
