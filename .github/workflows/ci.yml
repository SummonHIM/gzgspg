name: Build

on:
  push:
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "docs/**"
      - "**/*.md"
    branches:
      - "main"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositories
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Install linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libgtk-3-dev libayatana-appindicator3-dev xvfb

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: xvfb-run -a go test ./... -count=1

  build:
    needs: [check]
    runs-on: ${{ matrix.jobs.runs-on || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        jobs:
          - { goos: linux, goarch: "386", output: "386", deps: multilib, deb: i386, rpm: i386 }
          - { goos: linux, goarch: amd64, output: amd64, deb: amd64, rpm: x86_64 }
          - { goos: linux, goarch: arm64, output: arm64, deps: arm64, deb: arm64, rpm: aarch64 }

          - { goos: windows, goarch: "386", output: "386", runs-on: windows-latest, win: true }
          - { goos: windows, goarch: amd64, output: amd64, runs-on: windows-latest, win: true }
          - { goos: windows, goarch: arm64, output: arm64, runs-on: windows-latest, win: true }

          - { goos: darwin, goarch: amd64, output: amd64, runs-on: macos-13, mac: true }
          - { goos: darwin, goarch: arm64, output: arm64, runs-on: macos-14, mac: true }

    steps:
      - name: Checkout repositories
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Install linux dependencies
        if: matrix.jobs.goos == 'linux'
        run: |
          sudo apt-get update

          # 原生 amd64：直接装开发包
          sudo apt-get install -y \
            gcc pkg-config \
            libgl1-mesa-dev xorg-dev libgtk-3-dev libayatana-appindicator3-dev

          if [ "${{ matrix.jobs.deps }}" = "multilib" ]; then
            # 386 需要 i386 版的 GL/X11 开发库，否则链接期找不到 -lGL / -lX11 等
            sudo dpkg --add-architecture i386
            sudo apt-get update
            sudo apt-get install -y gcc-multilib
            sudo apt-get install -y \
              libgl1-mesa-dev:i386 \
              libglu1-mesa-dev:i386 \
              libx11-dev:i386 \
              libxrandr-dev:i386 \
              libxxf86vm-dev:i386 \
              libxi-dev:i386 \
              libxcursor-dev:i386 \
              libxinerama-dev:i386 \
              libxkbcommon-dev:i386 \
              libwayland-dev:i386 \
              libgtk-3-dev:i386 \
              libayatana-appindicator3-dev:i386
          fi

          if [ "${{ matrix.jobs.deps }}" = "arm64" ]; then
            # arm64 交叉编译：需要 arm64 版的 GL/X11 开发库才能链接。
            # 主源限定 amd64，arm64 走 ports.ubuntu.com（archive 上 arm64 会 404）。
            sudo dpkg --add-architecture arm64
            sudo sed -i \
              -e 's|^deb |deb [arch=amd64] |' \
              -e 's|^deb-src |deb-src [arch=amd64] |' \
              /etc/apt/sources.list
            CODENAME="$(lsb_release -cs)"
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${CODENAME} main restricted universe multiverse" \
              | sudo tee /etc/apt/sources.list.d/ubuntu-ports-arm64.list > /dev/null
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${CODENAME}-updates main restricted universe multiverse" \
              | sudo tee -a /etc/apt/sources.list.d/ubuntu-ports-arm64.list > /dev/null
            sudo apt-get update
            sudo apt-get install -y gcc-aarch64-linux-gnu
            sudo apt-get install -y \
              libgl1-mesa-dev:arm64 \
              libglu1-mesa-dev:arm64 \
              libx11-dev:arm64 \
              libxrandr-dev:arm64 \
              libxxf86vm-dev:arm64 \
              libxi-dev:arm64 \
              libxcursor-dev:arm64 \
              libxinerama-dev:arm64 \
              libxkbcommon-dev:arm64 \
              libwayland-dev:arm64 \
              libgtk-3-dev:arm64 \
              libayatana-appindicator3-dev:arm64
          fi

      - name: Set up environment variables
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "PKGVER=${VERSION}" >> $GITHUB_ENV
          echo "PKGARCH_DEB=${{ matrix.jobs.deb }}" >> $GITHUB_ENV
          echo "PKGARCH_RPM=${{ matrix.jobs.rpm }}" >> $GITHUB_ENV
          echo "BUILDTIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV
      - name: Build windows icon resource
        if: matrix.jobs.goos == 'windows'
        shell: bash
        run: |
          set -xeuo pipefail
          go install github.com/akavel/rsrc@latest
          "$(go env GOPATH)/bin/rsrc" -arch ${{ matrix.jobs.goarch }} -ico assets/icon.ico -o rsrc.syso

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.jobs.goos }}
          GOARCH: ${{ matrix.jobs.goarch }}
          CGO_ENABLED: "1"
        run: |
          set -xeuo pipefail
          mkdir -p dist

          # GOOS=windows 时 go build 会给 -o 的名称自动补 .exe，把实际产物名导出给后续步骤
          BIN="gzgspg"
          if [ "${{ matrix.jobs.goos }}" = "windows" ]; then
            BIN="gzgspg.exe"
          fi
          echo "BIN=${BIN}" >> $GITHUB_ENV

          # 32 位 linux 需要 -m32 的编译与链接标志；写成 CC="gcc -m32" 会被 Go 当作命令名。
          if [ "${{ matrix.jobs.goos }}" = "linux" ] && [ "${{ matrix.jobs.goarch }}" = "386" ]; then
            export CGO_CFLAGS="-m32"
            export CGO_LDFLAGS="-m32"
          fi
          if [ "${{ matrix.jobs.goos }}" = "linux" ] && [ "${{ matrix.jobs.goarch }}" = "arm64" ]; then
            export CC="aarch64-linux-gnu-gcc"
          fi

          go build -v -trimpath \
            -ldflags "-X 'github.com/summonhim/gzgspg/internal/version.Value=${VERSION}' -X 'github.com/summonhim/gzgspg/internal/version.BuildTime=${BUILDTIME}' -w -s" \
            -o "${BIN}"

          if [ "${{ matrix.jobs.goos }}" = "windows" ]; then
            cp "${BIN}" "dist/gzgspg-windows-${{ matrix.jobs.output }}.exe"
            (cd dist && zip "gzgspg-windows-${{ matrix.jobs.output }}-${VERSION}.zip" "gzgspg-windows-${{ matrix.jobs.output }}.exe")
          elif [ "${{ matrix.jobs.goos }}" = "linux" ]; then
            tar -czf "dist/gzgspg-linux-${{ matrix.jobs.output }}-${VERSION}.tar.gz" -C . "${BIN}"
          fi

      - name: Package DEB and RPM
        if: matrix.jobs.goos == 'linux'
        shell: bash
        run: |
          set -xeuo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          NFPM="$(go env GOPATH)/bin/nfpm"

          # nfpm 的 arch 是顶层字段，不支持 per-format 覆盖，故每种格式各注入一次 PKGARCH
          PKGARCH="${PKGARCH_DEB}" "$NFPM" package -f files/release/nfpm.yaml -p deb -t dist/
          PKGARCH="${PKGARCH_RPM}" "$NFPM" package -f files/release/nfpm.yaml -p rpm -t dist/

      - name: Package AppImage
        if: matrix.jobs.goos == 'linux' && matrix.jobs.output == 'amd64'
        shell: bash
        run: |
          set -xeuo pipefail
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -e VERSION="${VERSION}" \
            ubuntu:22.04 \
            bash -c '
              set -xeuo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y curl file fuse libfuse2 desktop-file-utils \
                libgtk-3-0 libayatana-appindicator3-1
              curl -fsSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
              curl -fsSL -o plugin-gtk https://github.com/linuxdeploy/linuxdeploy-plugin-gtk/releases/download/continuous/linuxdeploy-plugin-gtk.sh
              chmod +x linuxdeploy plugin-gtk
              export ARCH=x86_64
              export DEPLOY_GTK_VERSION=3
              export LINUXDEPLOY_OUTPUT_VERSION="${VERSION}"
              ./linuxdeploy --appdir AppDir \
                --desktop-file files/release/gzgspg.desktop \
                --icon-file assets/icon.png \
                --executable gzgspg \
                --plugin gtk \
                --output appimage
              mv gzgspg*.AppImage "dist/gzgspg-linux-amd64-${VERSION}.AppImage"
            '

      - name: Install WiX
        if: matrix.jobs.goos == 'windows'
        shell: pwsh
        run: dotnet tool install --global wix

      - name: Package MSI
        if: matrix.jobs.goos == 'windows'
        shell: pwsh
        run: |
          ./files/release/build-msi.ps1 `
            -Version "$env:VERSION" `
            -Arch "${{ matrix.jobs.output }}" `
            -ExeName "gzgspg-windows-${{ matrix.jobs.output }}.exe" `
            -DistDir "dist" `
            -OutDir "dist"

      - name: Package macOS app
        if: matrix.jobs.goos == 'darwin'
        shell: bash
        run: |
          set -xeuo pipefail
          APP="dist/gzgspg.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          cp "${BIN}" "$APP/Contents/MacOS/gzgspg"
          chmod +x "$APP/Contents/MacOS/gzgspg"

          sed "s/@@VERSION@@/${VERSION}/" files/release/Info.plist > "$APP/Contents/Info.plist"

          # icon.png -> icon.icns
          ICONSET="$(mktemp -d)/gzgspg.iconset"
          mkdir -p "$ICONSET"
          for s in 16 32 64 128 256 512; do
            sips -z $s $s assets/icon.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2))
            sips -z $d $d assets/icon.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/gzgspg.icns"

          (cd dist && zip -r "gzgspg-macos-${{ matrix.jobs.output }}-${VERSION}.zip" "gzgspg.app")

          # dmg：app + Applications 软链
          STAGE="$(mktemp -d)/dmg"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "gzgspg" -srcfolder "$STAGE" -ov -format UDZO \
            "dist/gzgspg-macos-${{ matrix.jobs.output }}-${VERSION}.dmg"

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.jobs.goos }}-${{ matrix.jobs.output }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [check, build]
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: bin
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R
        working-directory: bin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: bin/*
          draft: true
          generate_release_notes: true
