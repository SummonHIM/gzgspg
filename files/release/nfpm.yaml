name: gzgspg
arch: "{{.Env.PKGARCH_DEB}}"
platform: linux
version: "{{.Env.PKGVER}}"
section: net
priority: optional
maintainer: SummonHIM <summonhim@summonhim.top>
description: |
  广工商校园网登录器（GUI）。
homepage: https://github.com/SummonHIM/gzgspg
license: MIT
contents:
  - src: gzgspg
    dst: /usr/bin/gzgspg
    file_info:
      mode: 0755
  - src: files/release/gzgspg.desktop
    dst: /usr/share/applications/gzgspg.desktop
  - src: assets/icon.png
    dst: /usr/share/icons/hicolor/256x256/apps/gzgspg.png
overrides:
  deb:
    arch: "{{.Env.PKGARCH_DEB}}"
  rpm:
    arch: "{{.Env.PKGARCH_RPM}}"
